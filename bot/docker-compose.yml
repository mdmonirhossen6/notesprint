services:
  telegram-bot-api:
    build:
      context: .
      dockerfile: docker/telegram-bot-api.Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in bot/.env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in bot/.env}
    volumes:
      - ./data/bot-api:/var/lib/telegram-bot-api
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BOT_API_ROOT: http://telegram-bot-api:8081
      BOT_API_ALLOW_HTTP: "true"
      LOCAL_FILE_ROOT: /var/lib/telegram-bot-api
      DATABASE_PATH: /app/data/notesprint.db
      TMP_DIR: /app/tmp
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./data/bot-api:/var/lib/telegram-bot-api:ro
    ports:
      - "8080:8080"
